name: macOS install test

# Installs the latest Lockpin release on GitHub's macOS machines exactly as a
# user would (the public one-line installer from lockpin.dev), then checks
# that the program runs, its service starts, and its cap refuses a call before
# it reaches the provider. No secrets, no provider keys: the test call is
# refused by its budget, so nothing is sent anywhere.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Machine
        run: sw_vers; uname -m

      - name: Install with the public one-line installer
        run: curl --proto '=https' --tlsv1.2 -fsSL https://lockpin.dev/install.sh | sh

      - name: The program runs
        run: |
          bin="$HOME/.local/bin/lockpin"
          "$bin" version
          file "$bin"
          codesign -dv "$bin" 2>&1 | grep -E "Signature|Identifier|Format" || true

      - name: The service is running
        run: |
          bin="$HOME/.local/bin/lockpin"
          "$bin" service status || true
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/lockpin/healthz && exit 0
            sleep 1
          done
          echo "no answer on 127.0.0.1:8787"; tail -50 "$HOME/Library/Logs/Lockpin/lockpin.log" 2>/dev/null; exit 1

      - name: The cap refuses a call before it is sent
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' -X POST http://127.0.0.1:8787/anthropic/v1/messages \
            -H 'content-type: application/json' -H 'anthropic-version: 2023-06-01' -H 'x-api-key: not-a-real-key' \
            -H 'X-Lockpin-Task: mac-test' -H 'X-Lockpin-Budget-Usd: 0.0000001' \
            -d '{"model":"claude-haiku-4-5","max_tokens":50,"messages":[{"role":"user","content":"hi"}]}')
          cat body.json; echo
          test "$code" = 402

  # Builds the macOS installer packages from the release's own archives with
  # the same script the release uses (packaging/macos/build-pkg.sh, copied
  # here), installs the one for this Mac, checks what it put where, then
  # removes it with its uninstall script. The pkg is not signed, which
  # `installer` run by root does not ask for.
  pkg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PKGDIR: /Library/Application Support/Lockpin/pkg
    steps:
      - uses: actions/checkout@v4

      - name: Download the release's macOS archives
        run: |
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          case "$(uname -m)" in arm64) echo "ARCH=arm64" >> "$GITHUB_ENV" ;; x86_64) echo "ARCH=amd64" >> "$GITHUB_ENV" ;; esac
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D dist -p 'lockpin_*_darwin_*.tar.gz' -p SHA256SUMS
          ls -l dist
          # The licence files the pkg carries are the ones in the release.
          name="lockpin_${tag#v}_darwin_arm64"
          tar -xzf "dist/$name.tar.gz" "$name/LICENSE" "$name/NOTICE"
          cp "$name/LICENSE" "$name/NOTICE" .

      - name: Build both packages
        run: VERSION="$TAG" sh packaging/macos/build-pkg.sh

      - name: What the package holds
        run: |
          pkg="dist/packages/lockpin_${TAG#v}_darwin_$ARCH.pkg"
          pkgutil --payload-files "$pkg"
          pkgutil --expand "$pkg" expanded
          find expanded -maxdepth 3
          test -x expanded/lockpin-component.pkg/Scripts/postinstall

      - name: Install it as root, as Jamf or a double-click would
        run: sudo installer -pkg "dist/packages/lockpin_${TAG#v}_darwin_$ARCH.pkg" -target / -verboseR

      - name: Installed where the docs say
        run: |
          set -x
          ls -l "$PKGDIR"
          test "$(readlink /usr/local/bin/lockpin)" = "$PKGDIR/lockpin"
          /usr/local/bin/lockpin version | grep -F "${TAG#v}"
          file "$PKGDIR/lockpin" | grep -q "$(uname -m)"
          pkgutil --pkg-info dev.lockpin.pkg | grep -F "version: ${TAG#v}"
          # Only root may change the folder root runs from.
          stat -f '%Su %Sp' "$PKGDIR" | grep -E '^root d....-..-.'
          test ! -e /Library/LaunchDaemons/dev.lockpin.node.plist

      - name: Remove it with its uninstall script
        run: |
          sudo "$PKGDIR/uninstall.sh"
          test ! -e "$PKGDIR"
          test ! -e /usr/local/bin/lockpin
          if pkgutil --pkg-info dev.lockpin.pkg; then echo "receipt still there"; exit 1; fi
